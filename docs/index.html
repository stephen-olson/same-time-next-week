<style>
/* Layout: sticky header (brand, city switch, section tabs); one main column per section; event details open in a sheet, a centered dialog on desktop and a bottom sheet on phones. */
:root {
  --bg: #F4F6F1;
  --surface: #FFFFFF;
  --surface-2: #ECEFE8;
  --hover: #EFF2EB;
  --fg: #1A1F1B;
  --muted: #5B665D;
  --line: #DAE0D6;
  --ink: #2C4C9C;
  --ink-tint: #E4EAF8;
  --ink-fg: #1D3777;
  --give: #1B7246;
  --give-tint: #DCF0E3;
  --give-fg: #12512F;
  --today: #C2410C;
  --today-fg: #FFFFFF;
  --pick: #A86A12;
  --scrim: rgba(16, 20, 17, .5);
  --shadow: 0 1px 2px rgba(26, 31, 27, .06), 0 8px 24px rgba(26, 31, 27, .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101411; --surface: #181D19; --surface-2: #1F2520; --hover: #212822;
    --fg: #E5EAE3; --muted: #9AA59B; --line: #2B332C;
    --ink: #93ACF0; --ink-tint: #1E2946; --ink-fg: #CAD7FA;
    --give: #6CCF98; --give-tint: #15331F; --give-fg: #B3EAC9;
    --today: #FB8C4F; --today-fg: #1A1F1B; --pick: #E5B24C;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101411; --surface: #181D19; --surface-2: #1F2520; --hover: #212822;
  --fg: #E5EAE3; --muted: #9AA59B; --line: #2B332C;
  --ink: #93ACF0; --ink-tint: #1E2946; --ink-fg: #CAD7FA;
  --give: #6CCF98; --give-tint: #15331F; --give-fg: #B3EAC9;
  --today: #FB8C4F; --today-fg: #1A1F1B; --pick: #E5B24C;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input { font: inherit; color: inherit; }
a { color: var(--ink-fg); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ic { width: 1em; height: 1em; flex: none; vertical-align: -0.125em; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lg-bg { fill: var(--ink); } .lg-dot { fill: var(--bg); } .lg-hi { fill: var(--give); }

/* Header */
.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; min-width: 0; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.cityswitch { display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.cityswitch button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
.cityswitch button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 10px 12px;
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent;
}
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.pill { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }

/* Intro */
.intro { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-block: 24px 0; }
.intro > div:first-child { min-width: 0; }
.intro h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 3.6vw, 36px); line-height: 1.1; letter-spacing: -.015em; margin: 0 0 4px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 62ch; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.quiet { border: 0; background: none; padding: 8px 2px; color: var(--ink-fg); font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.quiet:hover { text-decoration: underline; text-underline-offset: 3px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 15px; border-radius: 10px;
  font-size: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.primary:hover { opacity: .9; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 9px; }
.btn:disabled { cursor: default; opacity: .7; }
.textbtn { height: 36px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 14px; font-weight: 600; }
.linkish { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 16px 2px; }
.fbreak { flex-basis: 100%; height: 0; }
.fchip.more { border-style: dashed; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.fchip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.fchip.give { color: var(--give-fg); border-color: var(--give); }
.fchip.give[aria-pressed="true"] { background: var(--give); color: var(--surface); }
.fsep { flex: none; width: 1px; margin: 4px 3px; background: var(--line); }
.fclear { flex: none; border: 0; background: none; color: var(--ink-fg); font-weight: 600; font-size: 13px; cursor: pointer; padding: 7px 6px; }

/* Lists */
.day { margin-top: 26px; }
.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.dayhead h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; margin: 0; }
.dayhead .sub { color: var(--muted); font-size: 14px; }
.dayhead .hol, .hol { color: var(--today); font-weight: 600; font-size: 13px; }
.none { color: var(--muted); padding: 12px 0; margin: 0; }
.items { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .time { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 1px; }
.row.give .time { color: var(--give-fg); }
.row .main { display: block; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.row .title { display: block; font-weight: 700; font-size: 16px; line-height: 1.3; }
.row .main:hover .title { text-decoration: underline; text-underline-offset: 3px; }
.row .meta { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.row .tags { margin-top: 7px; }
.gobtn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 16px;
}
.gobtn:hover { background: var(--hover); border-color: var(--muted); }
.gobtn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.gheart { color: var(--give); margin-right: 6px; font-size: 14px; }
.flag { color: var(--fg); font-weight: 600; }
.more-wrap { margin-top: 20px; }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .time { grid-column: 1 / -1; font-size: 13px; }
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--ink-tint); color: var(--ink-fg); white-space: nowrap;
}
.tag.give { background: var(--give-tint); color: var(--give-fg); }
.tag.solo { background: var(--surface-2); color: var(--fg); }
.tag.signup { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.tag.pick { background: transparent; color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick); }
.tag.city { background: var(--surface-2); color: var(--muted); }

/* Calendar */
.monthnav { display: flex; align-items: center; gap: 8px; margin: 22px 0 12px; }
.monthnav h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0 6px; min-width: 9.6ch; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 17px; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.callayout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-width: 0; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dow div { padding: 8px 10px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cell { min-width: 0; min-height: 118px; padding: 6px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; }
.cell:nth-child(7n) { border-right: 0; }
.cell.lastrow { border-bottom: 0; }
.cell:hover { background: var(--hover); }
.cell.out { background: var(--surface-2); cursor: default; }
.cell.out .num { opacity: .4; }
.cell.past .chip, .cell.past .more, .cell.past .dots { opacity: .5; }
.cell.past .num { color: var(--muted); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.cellhead { display: flex; align-items: center; gap: 4px; min-width: 0; }
.num { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--fg); padding: 0; cursor: pointer; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell.today .num { background: var(--today); color: var(--today-fg); }
.cell .hol { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip { display: flex; align-items: center; gap: 4px; width: 100%; min-width: 0; text-align: left; cursor: pointer; border: 0; border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 500; line-height: 1.3; background: var(--ink-tint); color: var(--ink-fg); }
.chip:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.chip.give { background: var(--give-tint); color: var(--give-fg); }
.chip.give:hover { box-shadow: inset 0 0 0 1px var(--give); }
.chip.going { box-shadow: inset 0 0 0 1.5px currentColor; }
.chip .t { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .n { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip .star, .tag .star { color: var(--pick); }
.more { border: 0; background: none; padding: 1px 6px; text-align: left; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.dots { display: none; }
.daypanel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 18px 8px; min-width: 0; }
.dp-head { padding: 14px 0 10px; border-bottom: 2px solid var(--fg); }
.dp-head h3 { font-family: var(--f-display); font-weight: 800; font-size: 26px; margin: 2px 0 0; line-height: 1.1; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.daypanel .row { grid-template-columns: minmax(0, 1fr) auto; }
.daypanel .row .time { grid-column: 1 / -1; font-size: 13px; }
.daypanel .row:last-child { border-bottom: 0; }
.horizon { color: var(--muted); font-size: 13.5px; margin: 14px 0 0; }
.holnote { margin: 10px 0 0; font-size: 13.5px; padding: 8px 11px; border-radius: 9px; background: var(--surface-2); }
@media (max-width: 980px) { .callayout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .monthnav h2 { font-size: 21px; min-width: 0; }
  .dow div { padding: 6px 0; text-align: center; font-size: 11px; letter-spacing: .04em; }
  .cell { min-height: 58px; padding: 5px 2px; align-items: center; gap: 5px; }
  .cellhead { justify-content: center; }
  .chip, .more, .cell .hol { display: none; }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 40px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .dot.give { background: var(--give); }
  .cell.hasHol .num { box-shadow: 0 0 0 1.5px var(--today); }
  .cell.today.hasHol .num { box-shadow: none; }
  .daypanel { padding: 4px 14px 8px; }
}

/* Join anytime + plan cards */
.jgroup { margin-top: 30px; }
.jgroup > h2, .secthead h2 { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.01em; margin: 0; }
.jsub { color: var(--muted); margin: 4px 0 14px; max-width: 70ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.card .sched { margin: 0; font-weight: 600; font-size: 14px; }
.card .cdesc { margin: 0; color: var(--muted); font-size: 14px; }
.card .cactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
.secthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.plansec { margin-top: 30px; }
.dots6 { display: inline-flex; gap: 5px; }
.dots6 i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.dots6 i.on { background: var(--give); }
.empty-state { margin-top: 30px; padding: 26px; border: 1px dashed var(--line); border-radius: 16px; background: var(--surface); }
.empty-state h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 24px; }
.empty-state p { margin: 0 0 16px; color: var(--muted); max-width: 60ch; }

/* Sheet */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--scrim); padding: 24px; }
.sheet { position: relative; background: var(--surface); color: var(--fg); width: min(580px, 100%); max-height: 100%; overflow: auto; border-radius: 18px; box-shadow: var(--shadow); padding: 22px 24px 26px; }
.sheet:focus { outline: none; }
.close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; font-size: 16px; }
.sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -.015em; line-height: 1.08; margin: 10px 44px 6px 0; text-wrap: balance; }
.sheet h2:focus { outline: none; }
.sheet .lede { color: var(--muted); margin: 0 0 16px; }
.when { margin: 0; font-weight: 600; }
.goingrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 16px 0 4px; }
.bigbtn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--fg); background: var(--surface); color: var(--fg); font-size: 15px; font-weight: 700; cursor: pointer; }
.bigbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.visits { color: var(--muted); font-size: 14px; }
.desc { margin: 14px 0 0; }
.goodtoknow { margin: 12px 0 0; font-size: 14.5px; }
.firsttime { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--ink-tint); font-size: 14.5px; }
.firsttime b { color: var(--ink-fg); }
.suggest { margin-top: 34px; padding: 20px 22px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; }
.suggest > div { min-width: 0; flex: 1 1 320px; }
.suggest h2 { font-family: var(--f-display); font-weight: 800; font-size: 21px; margin: 0 0 4px; }
.suggest p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 60ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 16px; margin: 18px 0; }
.facts dt { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.addr { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.addcal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.addcal .lbl { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.note { margin-top: 16px; padding: 11px 13px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.upcoming { margin-top: 18px; }
.upcoming h3, .wh { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.datechips { display: flex; flex-wrap: wrap; gap: 6px; }
.datechip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.datechip[aria-current="true"] { background: var(--ink-tint); border-color: var(--ink); color: var(--ink-fg); }
.datechip.marked::after { content: " ✓"; }
.checked { margin: 18px 0 0; color: var(--muted); font-size: 12.5px; }
.feedpick { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE'];
  function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function fold(line) { var out = []; while (line.length > 73) { out.push(line.slice(0, 73)); line = ' ' + line.slice(73); } out.push(line); return out.join('\r\n'); }
  function endOf(e) { if (e.end) return e.end; var x = hm(e.start); return pad(Math.min(x.h + 2, 23)) + ':' + pad(x.m); }
  function descText(e) {
    return [e.description, e.timeNote, e.howToJoin ? 'How to join: ' + e.howToJoin : '', e.verifyNote ? 'Before you go: ' + e.verifyNote : '', safeUrl(e.url) || '']
      .filter(Boolean).join('\n\n');
  }
  function vevent(e, k) {
    var ds = compact(k), now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
    var L = ['BEGIN:VEVENT', 'UID:' + e.id + '-' + ds + '@same-time-next-week', 'DTSTAMP:' + stamp];
    if (e.start) {
      var en = endOf(e), endDay = en <= e.start ? compact(addDays(k, 1)) : ds;
      L.push('DTSTART;TZID=America/New_York:' + ds + 'T' + e.start.replace(':', '') + '00', 'DTEND;TZID=America/New_York:' + endDay + 'T' + en.replace(':', '') + '00');
    } else {
      L.push('DTSTART;VALUE=DATE:' + ds, 'DTEND;VALUE=DATE:' + compact(addDays(k, 1)));
    }
    L.push('SUMMARY:' + icsEsc(e.title), 'LOCATION:' + icsEsc([e.venue, e.address].filter(Boolean).join(', ')), 'DESCRIPTION:' + icsEsc(descText(e)));
    if (safeUrl(e.url)) L.push('URL:' + e.url);
    L.push('END:VEVENT');
    return L;
  }
  function icsDoc(items) {
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Same Time Next Week//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'].concat(VTZ);
    items.forEach(function (x) { L = L.concat(vevent(x.e, x.d)); });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  }
  function downloadIcs(text, name) {
    if (D.preview) { toast('Calendar files download on the live site.'); return; }
    var file = name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.ics';
    if (isIOS) { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(text); return; }
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url; a.download = file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      toast('Calendar file downloaded. Open it to add to your calendar.');
    } catch (err) { toast('Your browser blocked the download.'); }
  }
  function gcalUrl(e, k) {
    var ds = compact(k), dates;
    if (e.start) {
      var en = endOf(e), endDay = en <= e.start ? compact(addDays(k, 1)) : ds;
      dates = ds + 'T' + e.start.replace(':', '') + '00/' + endDay + 'T' + en.replace(':', '') + '00';
    } else dates = ds + '/' + compact(addDays(k, 1));
    var q = new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates: dates, ctz: 'America/New_York', details: descText(e), location: [e.venue, e.address].filter(Boolean).join(', ') });
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  }
  function outlookUrl(e, k) {
    var q = new URLSearchParams({ path: '/calendar/action/compose', rru: 'addevent', subject: e.title, body: descText(e), location: [e.venue, e.address].filter(Boolean).join(', ') });
    if (e.start) {
      var en = endOf(e), endDay = en <= e.start ? addDays(k, 1) : k;
      q.set('startdt', k + 'T' + e.start + ':00'); q.set('enddt', endDay + 'T' + en + ':00');
    } else { q.set('startdt', k); q.set('enddt', addDays(k, 1)); q.set('allday', 'true'); }
    return 'https://outlook.live.com/calendar/0/deeplink/compose?' + q.toString();
  }
  function mapsUrl(e) {
    var q = encodeURIComponent([e.venue, e.address].filter(Boolean).join(', '));
    return isApple ? 'https://maps.apple.com/?q=' + q : 'https://www.google.com/maps/search/?api=1&query=' + q;
  }

  /* ---------- sheet ---------- */
  var modal = $('modal'), sheet = $('sheet'), lastFocus = null, pushed = false, modalOpen = false;
  function openModal(html, label) {
    if (!modalOpen) lastFocus = document.activeElement;
    sheet.innerHTML = '<button type="button" class="close" data-close="1" aria-label="Close">' + I.close + '</button>' + html;
    sheet.setAttribute('aria-label', label);
    modal.hidden = false;
    modalOpen = true;
    document.body.classList.add('noscroll');
    sheet.scrollTop = 0;
    var h = sheet.querySelector('h2');
    (h || sheet).focus({ preventScroll: true });
  }
  function hideModal() {
    if (!modalOpen) return;
    modal.hidden = true;
    modalOpen = false;
    document.body.classList.remove('noscroll');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  function closeModal() {
    if (pushed) { pushed = false; try { history.back(); return; } catch (err) { /* fall through */ } }
    hideModal();
    var h = (location.hash || '').slice(1);
    if (/^ev-/.test(h)) { try { history.replaceState(null, '', '#' + state.view); } catch (err) { /* ignore */ } }
  }
  function pushHash(h) {
    try { history.pushState({ sheet: 1 }, '', '#' + h); pushed = true; } catch (err) { pushed = false; }
  }

  function detailHtml(e, k) {
    var url = safeUrl(e.url), h = '<div class="tags">' + tagHtml(e) + (state.city === 'both' ? '<span class="tag city">' + CITY[e.city] + '</span>' : '') + '</div>';
    h += '<h2 tabindex="-1">' + esc(e.title) + '</h2>';
    if (k) h += '<p class="when">' + esc(longDate(k)) + ' · ' + esc(rangeText(e)) + '</p>';
    else h += '<p class="when">' + esc(e.rtext || 'Join any time') + '</p>';
    if (k && HOL[k]) h += '<p class="holnote"><b>' + esc(HOL[k]) + '.</b> Groups sometimes change plans on holidays, so check the website first.</p>';
    if (k) {
      var marked = isMarked(e.id, k);
      h += '<div class="goingrow"><button type="button" class="bigbtn" data-mark="' + e.id + '" data-date="' + k + '" aria-pressed="' + marked + '">' +
        (marked ? I.check : I.plus) + '<span>' + markLabel(k, marked, true) + '</span></button><span class="visits" data-for="' + e.id + '">' + esc(visitsText(e.id)) + '</span></div>';
    }
    if (e.description) h += '<p class="desc">' + esc(e.description) + '</p>';
    if (e.firstTime) h += '<div class="firsttime"><b>First time?</b> ' + esc(e.firstTime) + '</div>';
    else if (e.timeNote) h += '<p class="goodtoknow"><b>Good to know:</b> ' + esc(e.timeNote) + '</p>';
    h += '<dl class="facts">';
    if (e.venue || e.address) h += '<dt>Where</dt><dd><b>' + esc(e.venue || '') + '</b>' + (e.address ? '<br><span class="addr">' + esc(e.address) + '</span>' : '') + '</dd>';
    h += '<dt>Cost</dt><dd>' + esc(e.cost || 'Not listed') + '</dd>';
    h += '<dt>' + (e.kind === 'program' ? 'Schedule' : 'Repeats') + '</dt><dd>' + esc(e.rtext || '') + '</dd>';
    h += '<dt>' + (e.entry === 'show' ? 'How it works' : 'How to join') + '</dt><dd>' + esc(e.howToJoin || 'Check the website') + '</dd></dl>';
    h += '<div class="actions">' +
      (!e.noMap && (e.address || e.venue) ? '<a class="btn" href="' + esc(mapsUrl(e)) + '" target="_blank" rel="noopener noreferrer">Directions</a>' : '') +
      (url ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Website</a>' : '') +
      '<button type="button" class="btn" data-share="' + e.id + '" data-date="' + (k || '') + '">Share</button></div>';
    if (k) {
      h += '<div class="addcal"><span class="lbl">Add to calendar</span>' +
        '<button type="button" class="btn sm" data-ics="' + e.id + '" data-date="' + k + '">Apple</button>' +
        '<a class="btn sm" href="' + esc(gcalUrl(e, k)) + '" target="_blank" rel="noopener noreferrer">Google</a>' +
        '<a class="btn sm" href="' + esc(outlookUrl(e, k)) + '" target="_blank" rel="noopener noreferrer">Outlook</a></div>';
    }
    if (e.verifyNote) h += '<div class="note"><b>Before you go:</b> ' + esc(e.verifyNote) + '</div>';
    if (k) {
      var next = (e.occ || []).filter(function (x) { return x >= TODAY; }).slice(0, 8);
      if (next.length > 1 || (next.length === 1 && next[0] !== k)) {
        h += '<div class="upcoming"><h3>Upcoming dates</h3><div class="datechips">' + next.map(function (x) {
          return '<button type="button" class="datechip' + (isMarked(e.id, x) ? ' marked' : '') + '" data-open="' + e.id + '" data-date="' + x + '"' + (x === k ? ' aria-current="true"' : '') + '>' + esc(shortDate(x)) + '</button>';
        }).join('') + '</div></div>';
      }
    }
    h += '<p class="checked">Last checked ' + esc(fullDate(e.lastChecked || D.generated)) + '.' +
      (safeUrl(D.reportUrl) ? ' <a href="' + esc(D.reportUrl + '&title=' + encodeURIComponent('Problem: ' + e.title)) + '" target="_blank" rel="noopener noreferrer">Something wrong with this listing?</a>' : '') + '</p>';
    return h;
  }
  function openEvent(id, k, push) {
    var e = EV[id];
    if (!e) return;
    if (!k && e.kind !== 'program') k = nextDate(e);
    var already = modalOpen;
    openModal(detailHtml(e, k), e.title);
    if (push && !already) pushHash('ev-' + id + (k ? '-' + compact(k) : ''));
    else if (push && already) { try { history.replaceState(history.state, '', '#ev-' + id + (k ? '-' + compact(k) : '')); } catch (err) { /* ignore */ } }
  }

  var subFeed = null;
  var FEEDS = [['durham', 'Durham: everything'], ['raleigh', 'Raleigh: everything'], ['all', 'Durham and Raleigh: everything'], ['durham-volunteer', 'Durham: volunteering only'], ['raleigh-volunteer', 'Raleigh: volunteering only']];
  function feedUrl(name) {
    var base = D.siteUrl || (!D.preview && /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : '');
    return base ? new URL('cal/' + name + '.ics', base).href : null;
  }
  function subscribeHtml() {
    if (!subFeed) subFeed = state.city === 'both' ? 'all' : state.city;
    var label = FEEDS.filter(function (f) { return f[0] === subFeed; })[0][1];
    var h = '<h2 tabindex="-1">Sync to your calendar</h2><p class="lede">This puts every listing into the calendar app on your phone or computer, and keeps it up to date. If an event changes or is cancelled, your calendar changes too. You can remove it any time.</p>' +
      '<div class="feedpick" role="radiogroup" aria-label="Which listings">' + FEEDS.map(function (f) {
        return '<button type="button" role="radio" aria-checked="' + (f[0] === subFeed) + '" data-feed="' + f[0] + '">' + esc(f[1]) + '</button>';
      }).join('') + '</div>';
    var url = feedUrl(subFeed);
    if (!url) return h + '<p class="note">Subscriptions start working once the site is live on the web.</p>';
    var webcal = url.replace(/^https?:/, 'webcal:');
    return h + '<div class="subbtns"><a class="btn primary" href="' + esc(webcal) + '">Apple Calendar</a>' +
      '<a class="btn" href="' + esc('https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(webcal)) + '" target="_blank" rel="noopener noreferrer">Google Calendar</a>' +
      '<a class="btn" href="' + esc('https://outlook.live.com/calendar/0/addfromweb?url=' + encodeURIComponent(url) + '&name=' + encodeURIComponent('Same Time Next Week: ' + label)) + '" target="_blank" rel="noopener noreferrer">Outlook</a>' +
      '<button type="button" class="btn" data-copy="' + esc(url) + '">Copy link</button></div>' +
      '<p class="fine">On iPhone or Mac, tap Apple Calendar, then Subscribe. Google Calendar adds it to your Google account, so it shows up on Android too. Changes reach your calendar within about a day.</p>';
  }
  function openSubscribe() { subFeed = null; openModal(subscribeHtml(), 'Sync to your calendar'); }

  var wiz = { days: {}, cats: {}, solo: true }, lastSugg = {};
  function suggestions() {
    var end = addDays(TODAY, 42), out = [], used = {}, scored = [];
    var dayKeys = Object.keys(wiz.days), catKeys = Object.keys(wiz.cats);
    EVENTS.forEach(function (e) {
      if (e.kind === 'program' || !inCity(e)) return;
      if (wiz.solo && !e.solo) return;
      if (catKeys.length && !wiz.cats[group(e)]) return;
      var occ = (e.occ || []).filter(function (k) { return k >= TODAY && k <= end && (!dayKeys.length || wiz.days[parse(k).getDay()]); });
      if (occ.length < 2) return;
      scored.push({ e: e, occ: occ, score: Math.min(occ.length, 6) + (e.pick ? 3 : 0) + (e.entry === 'show' ? 2 : 0) + (e.free ? 1 : 0) });
    });
    scored.sort(function (a, b) { return b.score - a.score || (a.e.title < b.e.title ? -1 : 1); });
    scored.forEach(function (s) { if (out.length < 3 && !used[group(s.e)]) { out.push(s); used[group(s.e)] = 1; } });
    scored.forEach(function (s) { if (out.length < 3 && out.indexOf(s) < 0) out.push(s); });
    return out;
  }
  function wizOutHtml() {
    var s = suggestions();
    lastSugg = {};
    if (!s.length) return '<p class="none">Nothing matches yet. Try more days or interests.</p>';
    return '<h3 class="wh">Try these</h3>' + s.map(function (x) {
      var next = x.occ.slice(0, 4);
      lastSugg[x.e.id] = next;
      var done = next.every(function (k) { return isMarked(x.e.id, k); });
      return '<article class="sugg"><div class="tags">' + tagHtml(x.e) + '</div><h4>' + esc(x.e.title) + '</h4><p>' + esc(x.e.rtext || '') + (x.e.start ? ' · ' + esc(rangeText(x.e)) : '') +
        '</p><p>' + esc(metaLine(x.e)) + '</p><p>Next: ' + next.map(shortDate).join(', ') + '</p>' +
        '<button type="button" class="btn sm' + (done ? '' : ' primary') + '" data-addseries="' + x.e.id + '"' + (done ? ' disabled' : '') + '>' +
        (done ? I.check + 'Added to My plan' : I.plus + 'Add the next ' + next.length + ' dates to My plan') + '</button></article>';
    }).join('');
  }
  function openWizard() {
    wiz = { days: {}, cats: {}, solo: true };
    var h = '<h2 tabindex="-1">Help me choose</h2><p class="lede">Pick what works for you and get three regular things to try in ' + esc(CITY[state.city]) + '. Going back to the same thing is how strangers turn into friends.</p>' +
      '<fieldset class="wf"><legend>Which days usually work?</legend><div class="chips">' + [1, 2, 3, 4, 5, 6, 0].map(function (i) {
        return '<button type="button" class="fchip" data-wday="' + i + '" aria-pressed="false">' + DOW[i] + '</button>';
      }).join('') + '</div></fieldset>' +
      '<fieldset class="wf"><legend>What sounds good?</legend><div class="chips">' + GROUPS.map(function (g) {
        return '<button type="button" class="fchip' + (g[0] === 'volunteer' ? ' give' : '') + '" data-wcat="' + g[0] + '" aria-pressed="false">' + esc(g[1]) + '</button>';
      }).join('') + '</div></fieldset>' +
      '<label class="check"><input type="checkbox" id="wizSolo" checked> Only things that are easy to go to alone</label><div id="wizOut" aria-live="polite">' + wizOutHtml() + '</div>';
    openModal(h, 'Help me choose');
  }

  /* ---------- small helpers ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function copyText(text, msg) {
    function fallback() { toast('Copy this link: ' + text); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(msg || 'Link copied'); }, fallback);
      else fallback();
    } catch (err) { fallback(); }
  }
  function shareEvent(id, k) {
    var e = EV[id], url = location.href.split('#')[0] + '#ev-' + id + (k ? '-' + compact(k) : '');
    if (navigator.share && !D.preview) {
      navigator.share({ title: e.title, text: e.title + (k ? ' · ' + shortDate(k) : ''), url: url }).catch(function (err) {
        if (!err || err.name !== 'AbortError') copyText(url);
      });
      return;
    }
    copyText(url);
  }
  function setCity(c) {
    if (!CITY[c] || c === state.city) return;
    state.city = c;
    sset('city', c);
    render();
  }
  function shiftMonth(n) {
    var m = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + n, 1);
    if (m < MIN_MONTH || m > MAX_MONTH) return;
    state.calMonth = m;
    var t = parse(TODAY);
    state.calSel = (t.getFullYear() === m.getFullYear() && t.getMonth() === m.getMonth()) ? TODAY : ymd(m);
    renderView();
  }
  function revealDayPanel() {
    if (!window.matchMedia('(max-width: 980px)').matches) return;
    var p = $('daypanel');
    if (!p) return;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    p.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, b;
    if (t === modal) { closeModal(); return; }
    if ((b = t.closest('[data-close]'))) { closeModal(); return; }
    if ((b = t.closest('[data-mark]'))) { toggleMark(b.dataset.mark, b.dataset.date); refreshMarks(b.dataset.mark, b.dataset.date); return; }
    if ((b = t.closest('[data-addseries]'))) {
      (lastSugg[b.dataset.addseries] || []).forEach(function (k) { if (!isMarked(b.dataset.addseries, k)) toggleMark(b.dataset.addseries, k); });
      b.disabled = true; b.classList.remove('primary'); b.innerHTML = I.check + 'Added to My plan';
      toast('Added to My plan');
      return;
    }
    if ((b = t.closest('[data-open]'))) { openEvent(b.dataset.open, b.dataset.date || null, true); return; }
    if ((b = t.closest('[data-city]'))) { setCity(b.dataset.city); return; }
    if ((b = t.closest('[data-more]'))) { state.more = !state.more; renderFilters(); return; }
    if ((b = t.closest('[data-q]'))) { state.f[b.dataset.q] = !state.f[b.dataset.q]; renderFilters(); renderView(); return; }
    if ((b = t.closest('[data-cat]'))) {
      var c = b.dataset.cat, wasOn = !!state.f.cats[c];
      state.f.cats = {};
      if (c && !wasOn) state.f.cats[c] = true;
      renderFilters(); renderView(); return;
    }
    if ((b = t.closest('[data-clear]'))) { state.f = blankFilters(); renderFilters(); renderView(); return; }
    if ((b = t.closest('[data-span]'))) { state.span = +b.dataset.span; renderView(); return; }
    if ((b = t.closest('[data-month]'))) { shiftMonth(+b.dataset.month); return; }
    if ((b = t.closest('[data-today]'))) { state.calSel = TODAY; state.calMonth = monthOf(TODAY); renderView(); return; }
    if ((b = t.closest('[data-day]'))) { state.calSel = b.dataset.day; renderView(); revealDayPanel(); return; }
    if ((b = t.closest('[data-share]'))) { shareEvent(b.dataset.share, b.dataset.date || null); return; }
    if ((b = t.closest('[data-ics]'))) { var e = EV[b.dataset.ics]; downloadIcs(icsDoc([{ e: e, d: b.dataset.date }]), e.short || e.title); return; }
    if ((b = t.closest('[data-ics-plan]'))) {
      var items = planEntries().filter(function (x) { return x.d >= TODAY; }).map(function (x) { return { e: EV[x.id], d: x.d }; });
      if (items.length) downloadIcs(icsDoc(items), 'my-plan');
      return;
    }
    if ((b = t.closest('[data-sub]'))) { openSubscribe(); return; }
    if ((b = t.closest('[data-feed]'))) { subFeed = b.dataset.feed; sheet.innerHTML = '<button type="button" class="close" data-close="1" aria-label="Close">' + I.close + '</button>' + subscribeHtml(); var fb = sheet.querySelector('[data-feed="' + subFeed + '"]'); if (fb) fb.focus(); return; }
    if ((b = t.closest('[data-copy]'))) { copyText(b.dataset.copy, 'Calendar link copied'); return; }
    if ((b = t.closest('[data-wiz]'))) { openWizard(); return; }
    if ((b = t.closest('[data-wday]'))) {
      var d = b.dataset.wday;
      if (wiz.days[d]) delete wiz.days[d]; else wiz.days[d] = true;
      b.setAttribute('aria-pressed', String(!!wiz.days[d])); $('wizOut').innerHTML = wizOutHtml(); return;
    }
    if ((b = t.closest('[data-wcat]'))) {
      var w = b.dataset.wcat;
      if (wiz.cats[w]) delete wiz.cats[w]; else wiz.cats[w] = true;
      b.setAttribute('aria-pressed', String(!!wiz.cats[w])); $('wizOut').innerHTML = wizOutHtml(); return;
    }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'wizSolo') { wiz.solo = ev.target.checked; $('wizOut').innerHTML = wizOutHtml(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (!modalOpen) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
    if (ev.key === 'Tab') {
      var f = Array.prototype.filter.call(sheet.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'), function (x) { return x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && (document.activeElement === first || document.activeElement === sheet || !sheet.contains(document.activeElement))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });

  function route() {
    var h = (location.hash || '').replace(/^#/, '');
    var m = /^ev-(.+?)(?:-(\d{8}))?$/.exec(h);
    if (m && EV[m[1]]) {
      if (!document.getElementById('view').innerHTML) render();
      var k = m[2] ? m[2].slice(0, 4) + '-' + m[2].slice(4, 6) + '-' + m[2].slice(6) : null;
      openEvent(m[1], k, false);
      return;
    }
    pushed = false;
    hideModal();
    var view = VIEWS.indexOf(h) > -1 ? h : 'week';
    if (view !== state.view || !document.getElementById('view').innerHTML) {
      state.view = view;
      render();
      if (h) window.scrollTo(0, 0);
    }
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
  route();
})();
</script>
