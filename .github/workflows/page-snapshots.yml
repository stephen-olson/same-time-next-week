name: Page copies for the weekly check

# The weekly listing check runs in a cloud session that can't open most websites.
# The evening before it starts, this job opens every organizer page linked from
# data/events.json and saves the lines with dates, times and prices on the
# `snapshots` branch, where the check reads them. Actions are free for public repos.
on:
  schedule:
    - cron: "17 20 * * 1"   # Mondays 20:17 UTC (GitHub sometimes runs these hours late)
    - cron: "17 5 * * 2"    # backup run Tuesdays 05:17 UTC; the weekly check starts about 15:00 UTC Tuesday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-snapshots
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the listings
        run: git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" site

      - name: Save page copies
        run: python3 -I site/tools/snapshot.py "$RUNNER_TEMP/snapshots"

      - name: Replace the snapshots branch
        working-directory: ${{ runner.temp }}/snapshots
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Page copies $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots
